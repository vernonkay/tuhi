name: Bug report
description: Something in tuhi is broken or behaves wrong
labels: ["type:bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. A clear repro is the single most useful thing you can give, I read every issue and reply to every one.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
      placeholder: When I open a 3 GB log and filter to ERROR, ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Type ... into the filter
        3. ...
    validations:
      required: true
  - type: input
    id: file-size
    attributes:
      label: File size / type (if relevant)
      placeholder: e.g. 3.2 GB .log, or a 60 MB single-line minified JSON
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tuhi version
      description: The release you installed, or the commit you built from
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else?
      description: Screenshots, console output, or a small sample file if you can share one
