name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: >
            Thanks for opening your first issue in tuhi, and welcome. I read everything
            and every issue gets a reply. If this is a bug, a clear repro (OS, file size,
            exact steps) helps me get to it fast. Appreciate you taking the time.
          pr-message: >
            Thanks for your first pull request to tuhi, and welcome. I'll review it as
            soon as I can. If you haven't already, a quick skim of CONTRIBUTING.md keeps
            things smooth. Thank you for contributing.
