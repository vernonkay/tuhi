# CI is the real gate — it re-runs the same `just check` developers run locally,
# because local git hooks are skippable (--no-verify, merge commits). (Pattern from dt-platform.)
# Cross-platform is a standing invariant, so `check` runs on all three OSes, not Linux only.
name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux Tauri deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: extractions/setup-just@v4
      - name: Install supply-chain tools (cargo-audit, cargo-deny)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cd app && npm ci
      - name: Run all checks (fail late — surface every problem)
        run: just check
      - name: Tests
        if: success() || failure()
        run: just test

  # End-to-end tests drive the REAL built binary through WebDriver (tauri-driver), so they
  # exercise the native webview (WebView2 on Windows, WebKitGTK on Linux), the IPC bridge and
  # the Rust backend — the layers the jsdom component tests (just test) deliberately mock.
  # This is the machine-verified UI gate. macOS needs a third-party driver fork and is deferred.
  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux Tauri + WebDriver deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Edge WebDriver matched to WebView2 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # tauri-driver shells out to Microsoft Edge WebDriver, which must match the runner's
          # installed Edge/WebView2. msedgedriver-tool downloads the matching version into cwd.
          cargo install --git https://github.com/chippers/msedgedriver-tool
          msedgedriver-tool
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - run: cd app && npm ci
      - name: Build front-end + debug binary
        shell: bash
        run: |
          cd app
          npm run build
          cd src-tauri
          cargo build
      - name: E2E — Linux (virtual display)
        if: runner.os == 'Linux'
        env:
          TUHI_E2E_BINARY: ${{ github.workspace }}/app/src-tauri/target/debug/tuhi
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" bash -c "cd app && npm run e2e"
      - name: E2E — Windows
        if: runner.os == 'Windows'
        shell: bash
        env:
          TUHI_E2E_BINARY: ${{ github.workspace }}\app\src-tauri\target\debug\tuhi.exe
        run: cd app && npm run e2e

  attribution:
    name: attribution (no AI trailers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan new commits for AI attribution trailers
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bash scripts/check/ci-no-ai-trailers.sh
