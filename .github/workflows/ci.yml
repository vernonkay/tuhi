# CI is the real gate — it re-runs the same `just check` developers run locally,
# because local git hooks are skippable (--no-verify, merge commits). (Pattern from dt-platform.)
name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Linux Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: extractions/setup-just@v2
      - run: cd app && npm ci
      - name: Run all checks (fail late — surface every problem)
        run: just check
      - name: Tests
        if: success() || failure()
        run: just test
