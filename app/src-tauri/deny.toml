# cargo-deny config (runs in CI via `cargo deny check`, and locally if cargo-deny is
# installed). A permissive-licence allowlist plus a security-advisory gate. Extend
# `allow` when a new, genuinely acceptable licence legitimately appears in the tree.
#
# NOTE: unvalidated until the first CI run (cargo-deny is not installed locally). The
# allow-list may need extending once deny reports the real transitive licences.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
